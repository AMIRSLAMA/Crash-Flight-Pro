<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d16"><title>Crash Flight</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,"Segoe UI",sans-serif;background:#080d16;color:#f4f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 0,#1b3048,#080d16 68%)}
.card{width:min(370px,100%);aspect-ratio:1/1;border:1px solid #35465d;border-radius:24px;background:linear-gradient(155deg,#14243a,#0b1321 65%);box-shadow:0 24px 70px #0009;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.brand{font-size:15px;letter-spacing:2px;color:#9eb1c9;font-weight:700}.brand b{color:#f6bd4d}
.label{font-size:14px;color:#aebbd0;margin-top:8px}.round{font-size:clamp(27px,8vw,38px);font-weight:900;direction:ltr;color:#fff;font-variant-numeric:tabular-nums}
.divider{width:100%;height:1px;background:#2a3a50;margin:2px 0}
.forecast{font-size:clamp(42px,11vw,56px);font-weight:900;color:#f6c45b;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 4px 18px #0008}
.meta{font-size:11px;color:#9eafc4;line-height:1.6;min-height:34px}
button{width:100%;border:0;border-radius:14px;padding:16px 12px;font-size:16px;font-weight:900;color:#08120d;background:linear-gradient(#ffd16c,#e8a72d);cursor:pointer;box-shadow:0 8px 22px #e9a72d33}
button:disabled{opacity:.55;cursor:wait}
.status{font-size:11px;color:#94a7bf;min-height:16px}
.note{font-size:10px;color:#788ba4;line-height:1.5}
</style></head>
<body>
<main class="card">
 <div class="brand">✈ CRASH <b>FLIGHT</b></div>
 <section style="width:100%">
  <div class="label">رقم الجولة القادمة</div>
  <div class="round" id="nextRound">—</div>
 </section>
 <div class="divider"></div>
 <section style="width:100%">
  <div class="label">التوقع الواحد للجولة القادمة</div>
  <div class="forecast" id="forecast">—</div>
  <div class="meta" id="meta">اضغط الزر بنفسك قبل بداية الجولة لحساب تقدير جديد.</div>
 </section>
 <button id="predict">احسب توقع الجولة القادمة</button>
 <div class="status" id="status">في انتظار طلبك</div>
 <div class="note">تقدير إحصائي من النتائج المسجلة، وليس معرفة مسبقة أو ضمانًا للنتيجة.</div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
let crashes=[], nextRound=null, requestPending=false, requestTimer=null, roundFinished=false;
function askForEvents(){window.postMessage({source:"crash-flight-dashboard",type:"get-events",requestId:String(Date.now())},"*");}
function readEvents(events){
 if(!Array.isArray(events))return;
 crashes=events.filter(e=>e&&e.target==="OnCrash"&&Number.isFinite(Number(e.f))).map(e=>Number(e.f)).filter(n=>n>=1&&n<=100000).slice(-30);
 const betting=[...events].reverse().find(e=>e&&e.target==="OnBetting"&&e.roundId!==undefined&&e.roundId!==null);
 const stage=[...events].reverse().find(e=>e&&e.target==="OnStage"&&e.roundId!==undefined&&e.roundId!==null);
 nextRound=betting?.roundId??stage?.roundId??null;
 if(nextRound!==null)$("nextRound").textContent="#"+nextRound;
}
function calculate(){
 if(nextRound===null){$("forecast").textContent="—";$("meta").textContent="لم يصل رقم الجولة من الإضافة بعد. افتح اللعبة ثم حاول مرة أخرى.";return false;}
 if(crashes.length<10){$("forecast").textContent="بيانات غير كافية";$("meta").textContent="تم التقاط "+crashes.length+" نتيجة فقط؛ نحتاج 10 نتائج مكتملة على الأقل.";return false;}
 // Alternative model: regime-transition matching (Markov-style).
 // It looks for earlier occasions where the same low/medium/high pattern
 // appeared, then studies the outcomes that followed those patterns.
 const sample=crashes.slice(-30);
 const regime=n=>n<2?"L":n<5?"M":"H";
 const median=values=>{
  if(!values.length)return 1;
  const a=values.slice().sort((x,y)=>x-y),m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
 };
 const predictAt=(history,contextLength)=>{
  const base=median(history.slice(-10));
  const context=history.slice(-contextLength).map(regime).join("");
  const matches=[];
  for(let j=contextLength;j<history.length;j++){
   const prior=history.slice(j-contextLength,j).map(regime).join("");
   if(prior===context)matches.push(history[j]);
  }
  if(matches.length<2)return {value:base,matches:matches.length,base,matched:null};
  const matched=median(matches);
  const confidence=matches.length/(matches.length+4);
  const value=Math.exp(Math.log(base)*(1-confidence)+Math.log(matched)*confidence);
  return {value,matches:matches.length,base,matched};
 };
 const models=[1,2,3].map(contextLength=>{
  const errors=[];
  for(let i=10;i<sample.length;i++){
   const result=predictAt(sample.slice(0,i),contextLength);
   errors.push(Math.abs(Math.log(result.value/sample[i])));
  }
  errors.sort((x,y)=>x-y);
  const mid=Math.floor(errors.length/2);
  const score=errors.length%2?errors[mid]:(errors[mid-1]+errors[mid])/2;
  return {contextLength,score,tests:errors.length};
 }).filter(m=>m.tests>=6);
 if(!models.length){$("forecast").textContent="بيانات غير كافية";$("meta").textContent="لا توجد اختبارات تاريخية كافية لتقييم النموذج البديل.";return false;}
 models.sort((a,b)=>a.score-b.score||a.contextLength-b.contextLength);
 const best=models[0];
 const result=predictAt(sample,best.contextLength);
 const lastPattern=sample.slice(-best.contextLength).map(regime).join(" → ");
 const recent=sample.slice(-8);
 const counts={L:0,M:0,H:0};
 recent.forEach(n=>counts[regime(n)]++);
 const wave=counts.H>=4?"مرتفعة":counts.L>=5?"منخفضة":counts.M>=4?"متوسطة":"مختلطة";
 $("forecast").textContent=result.value.toFixed(2)+"x";
 $("meta").textContent="المعادلة البديلة: مطابقة نمط "+lastPattern+"؛ وجدت "+result.matches+" حالة مشابهة في السجل. "+(result.matched===null?"لم تتوفر حالات كافية، فاستخدمت وسيط آخر 10 نتائج.":"وسيط نتائج الحالات المشابهة "+result.matched.toFixed(2)+"x، مع دمجه تدريجيًا مع وسيط آخر 10 نتائج.")+" اختبار تاريخي: "+best.tests+" جولة. الموجة الأخيرة: "+wave+". هذا نموذج تجريبي لا يكشف نتيجة الجولة ولا يضمن استمرار النمط.";
 return true;
}
window.addEventListener("message",e=>{
 if(e.source!==window||e.data?.source!=="crash-flight-extension")return;
 if(e.data.type==="events"){
  readEvents(e.data.events||[]);
  const allEvents=e.data.events||[];
  const lastCrash=[...allEvents].reverse().find(ev=>ev&&ev.target==="OnCrash");
  const lastRoundStart=[...allEvents].reverse().find(ev=>ev&&(["OnStage","OnBetting","OnStart"].indexOf(ev.target)>=0));
  roundFinished=!!lastCrash&&(!lastRoundStart||Number(lastCrash.receivedAt)>Number(lastRoundStart.receivedAt));
  $("predict").hidden=false;
  if(requestPending){
   requestPending=false;clearTimeout(requestTimer);
   $("predict").disabled=false;
   const ok=calculate();
   $("status").textContent=ok?"تم حساب رقم واحد بناءً على السجل الحالي.":"لم يكتمل الحساب؛ راجع سبب نقص البيانات.";
  }
 }
 if(e.data.type==="unavailable"){
  requestPending=false;clearTimeout(requestTimer);$("predict").disabled=false;
  $("status").textContent="الإضافة غير متصلة؛ افتح اللعبة وفعّل الإضافة.";
 }
});
$("predict").addEventListener("click",()=>{
 if(requestPending)return;
 $("predict").disabled=true;$("status").textContent="جارٍ جلب النتائج بطلبك...";
 requestPending=true;askForEvents();
 requestTimer=window.setTimeout(()=>{
  if(requestPending){requestPending=false;$("predict").disabled=false;$("status").textContent="لم يصل رد من الإضافة. تأكد أنها متصلة ثم حاول مجددًا.";}
 },2500);
});
</script>
</body></html>
