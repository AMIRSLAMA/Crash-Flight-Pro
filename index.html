<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b15"><title>Sky Predictor</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,"Segoe UI",sans-serif;background:#070b15;color:#f4f7ff}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:radial-gradient(ellipse at 25% 0,#172a45 0,#070b15 65%)}
.app{width:min(760px,100%);min-height:420px;border:1px solid #344052;border-radius:22px;overflow:hidden;background:#080e1b;box-shadow:0 22px 70px #0009}
header{height:66px;display:flex;align-items:center;gap:13px;padding:0 20px;border-bottom:1px solid #263247;background:#090d16}
.logo{font-size:29px;color:#f5f8ff}.name{font-size:22px;font-weight:900;letter-spacing:.2px}.name span{color:#f7b83c}.spacer{flex:1}.window{display:flex;gap:16px;color:#9ba9bb;font-size:20px}
.main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(210px,.8fr);gap:14px;padding:16px}
.flight{position:relative;min-height:260px;border:1px solid #26364e;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 55% 100%,#183451,#08101f 68%)}
.skyline{position:absolute;inset:0;width:100%;height:100%}.cloud{fill:#1d2d48;opacity:.65}.grid{stroke:#263b55;stroke-dasharray:4 8;stroke-width:1}.flight-path{fill:none;stroke:#ffb72e;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 7px #ff9e20)}
.plane{position:absolute;left:48%;top:32%;font-size:46px;transform:rotate(-18deg);filter:drop-shadow(0 0 10px #f4b53c);transition:left .5s,top .5s}
.flight.active .plane{animation:cruise 7s ease-in-out infinite alternate}
@keyframes cruise{from{left:24%;top:66%}to{left:72%;top:14%}}
.multiplier{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:clamp(48px,9vw,76px);font-weight:900;direction:ltr;text-shadow:0 4px 18px #000}.multiplier small{font-size:.45em;color:#18e66b}
.signal{border:2px solid #e83d42;border-radius:16px;background:linear-gradient(160deg,#210c13,#100b13);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;min-height:260px}
.alert-icon{font-size:49px;color:#ff4148;line-height:1}.signal h2{font-size:25px;margin:12px 0 5px}.signal p{margin:0;color:#f7c84b;font-size:16px;line-height:1.6}.signal .sub{margin-top:12px;color:#aeb9c9;font-size:12px}
.bottom{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:12px;padding:0 16px 16px}
.info{background:#111d2d;border:1px solid #293c54;border-radius:12px;padding:10px 12px;min-height:60px}.info label{display:block;color:#a7b5c8;font-size:11px;margin-bottom:5px}.info strong{font-size:15px}.green{color:#22e66b}
button{border:0;border-radius:12px;padding:13px 17px;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(#13d64e,#079b37);color:white;box-shadow:0 5px 18px #00c94c33}button.secondary{background:#24364d;color:#eaf1fa;box-shadow:none;border:1px solid #3c526e}button:disabled{opacity:.45;cursor:not-allowed}
.tools{padding:0 16px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tools input{width:110px;background:#0b1524;border:1px solid #354a63;border-radius:9px;color:white;padding:10px;font-size:14px}.tools label{font-size:12px;color:#aebbd0}.history{padding:0 16px 14px;color:#93a5bb;font-size:11px;display:flex;gap:7px;flex-wrap:wrap}.history b{color:#65e5ae}.foot{text-align:center;color:#71839b;font-size:10px;padding:0 12px 12px}
@media(max-width:570px){.main{grid-template-columns:1fr}.flight,.signal{min-height:190px}.bottom{grid-template-columns:1fr 1fr}.bottom button{grid-column:1/-1}.window{display:none}.name{font-size:19px}}
</style></head>
<body>
<section class="app">
<header><div class="logo">✈</div><div class="name">Sky <span>Predictor</span></div><div class="spacer"></div><div class="window" aria-hidden="true">—　□　×</div></header>
<div class="main">
<div class="flight" id="flight">
<svg class="skyline" viewBox="0 0 600 300" preserveAspectRatio="none" aria-hidden="true">
<path class="grid" d="M0 70H600M0 140H600M0 210H600M100 0V300M220 0V300M340 0V300M460 0V300"/>
<path class="cloud" d="M0 72Q20 43 49 65Q71 32 105 66Q132 56 148 83H0ZM405 120Q428 89 456 111Q479 78 513 110Q550 94 574 130H405Z"/>
<path class="flight-path" d="M18 260 Q145 225 225 184 T410 105 T585 35"/>
</svg>
<div class="plane" id="plane">✈</div>
<div class="multiplier" id="multiplierDisplay">—<small>x</small></div>
</div>
<aside class="signal">
<div class="alert-icon">⚠</div><h2 id="signalTitle">لا توجد إشارة مبكرة</h2>
<p id="signalText">مراقبة الجولة<br>بانتظار بيانات حقيقية</p>
<div class="sub">لن يظهر تحذير تنبؤي بدون دليل من مصدر الجولة</div>
</aside>
</div>
<div class="bottom">
<div class="info"><label>رقم الجولة</label><strong id="roundNumber">—</strong></div>
<div class="info"><label>حالة الاتصال</label><strong class="green" id="connection">جاهز</strong></div>
<button id="start">بدء تسجيل جولة</button>
</div>
<div class="tools">
<label for="result">النتيجة بعد الانتهاء</label><input id="result" type="number" min="1" step=".01" placeholder="مثال 2.35">
<button class="secondary" id="save">حفظ النتيجة</button>
<button class="secondary" id="export">تصدير السجل</button>
<button class="secondary" id="historyToggle">السجل</button>
</div>
<div class="history" id="history" hidden></div>
<div class="foot">واجهة تجريبية صغيرة · تسجيل النتائج يدويًا حاليًا · لا تدّعي معرفة نتيجة الجولة القادمة</div>
</section>
<script>
"use strict";
const $=id=>document.getElementById(id),KEY="sky-predictor-results-v1";let active=false,round=0,results=[];
try{results=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(results))results=[]}catch{results=[]}
function showHistory(){$("history").hidden=false;$("history").innerHTML=results.length?results.slice(-12).reverse().map((v,i)=>'<span>#'+(results.length-i)+' <b>'+Number(v).toFixed(2)+'x</b></span>').join("　·　"):"لا توجد نتائج محفوظة";}
$("start").addEventListener("click",()=>{if(active)return;active=true;round++;$("roundNumber").textContent="#"+round;$("connection").textContent="تسجيل يدوي";$("flight").classList.add("active");$("signalTitle").textContent="الجولة قيد التسجيل";$("signalText").innerHTML="الطيارة تتحرك<br>بانتظار النتيجة النهائية";$("multiplierDisplay").innerHTML="LIVE<small> ·</small>";$("start").disabled=true;});
$("save").addEventListener("click",()=>{const n=Number($("result").value);if(!active||!Number.isFinite(n)||n<1){$("signalTitle").textContent="أدخل نتيجة الجولة";$("signalText").textContent="ابدأ التسجيل ثم احفظ المضاعف بعد انتهائها";return;}results.push(n);localStorage.setItem(KEY,JSON.stringify(results));active=false;$("flight").classList.remove("active");$("start").disabled=false;$("connection").textContent="تم الحفظ";$("multiplierDisplay").innerHTML=n.toFixed(2)+'<small>x</small>';$("signalTitle").textContent="انتهت الجولة";$("signalText").textContent="تم حفظ النتيجة — لا توجد إشارة للجولة القادمة";$("result").value="";});
$("historyToggle").addEventListener("click",showHistory);
$("export").addEventListener("click",()=>{if(!results.length){$("signalText").textContent="لا توجد نتائج للتصدير";return;}const blob=new Blob(["multiplier\n"+results.join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="sky-predictor-results.csv";a.click();URL.revokeObjectURL(a.href);});
</script>
</body></html>
