<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d18"><title>Sky Predictor</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,"Segoe UI",sans-serif;background:#080d18;color:#f4f7fb}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 5%,#172b43,#080d18 68%)}
.app{width:min(620px,100%);border:1px solid #34475d;border-radius:22px;overflow:hidden;background:#080f1c;box-shadow:0 25px 80px #0009}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #29384b;background:#0b1422}
.brand{font-size:22px;font-weight:900;letter-spacing:.2px}.brand i{font-style:normal;color:#55e1bb}.window{color:#90a2b7;letter-spacing:5px;font-size:17px}
main{padding:17px}.topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a7b9cc}.live{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#d7a64d}.dot.on{background:#41e0ae;box-shadow:0 0 12px #41e0ae}
.scene{height:225px;margin:13px 0;border:1px solid #1c3449;border-radius:15px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 58% 100%,#17384b 0,#0b1a2b 56%,#081321 100%)}
.scene:before,.scene:after{content:"";position:absolute;width:170px;height:45px;border-radius:50%;background:#172b40;filter:blur(13px);opacity:.8}.scene:before{top:48px;left:25px}.scene:after{bottom:25px;right:35px}
svg{position:absolute;inset:0;width:100%;height:100%}.grid{stroke:#294157;stroke-dasharray:4 9;opacity:.55}.path{fill:none;stroke:#ff9b36;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 7px #ff9b36)}
#plane{font-size:42px;transform-origin:center;filter:drop-shadow(0 0 9px #ff9b36)}
.scene.flying #plane{animation:flight 7s linear infinite alternate}
@keyframes flight{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(-300px,-135px) rotate(-8deg)}}
.center{position:absolute;bottom:13px;left:18px;font-size:12px;color:#8fa8bf}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#101f31;border:1px solid #263e54;border-radius:12px;padding:12px 14px;min-height:68px}.tile small{display:block;color:#8fa8bf;font-size:11px;margin-bottom:8px}.tile strong{font-size:19px}.accent{color:#62e4c0}
.alert{margin-top:11px;border:1px solid #31475a;background:#101c2a;border-radius:11px;padding:12px 14px;min-height:53px;display:flex;align-items:center;gap:10px}.alert b{font-size:13px;color:#e8f1fa}.alert span{font-size:12px;color:#a5b8ca;line-height:1.6}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 17px;border-top:1px solid #29384b;background:#0b1422;color:#91a6ba;font-size:11px}
button{border:0;border-radius:9px;padding:9px 13px;background:#19b987;color:#03251d;font-weight:800;cursor:pointer}button.secondary{background:#24374c;color:#eaf2fa;border:1px solid #3b5369}
@media(max-width:440px){.brand{font-size:18px}.scene{height:190px}.panel{gap:7px}.tile{padding:10px}.tile strong{font-size:16px}main{padding:12px}}
</style></head>
<body>
<section class="app">
<header><div class="brand">✈ <i>SKY</i> PREDICT</div><div class="window">—　□　×</div></header>
<main>
<div class="topline"><span>مراقبة جولات Crash</span><span class="live"><i class="dot" id="dot"></i><span id="connection">في انتظار اتصال اللعبة</span></span></div>
<div class="scene" id="scene">
<svg viewBox="0 0 620 225" preserveAspectRatio="none" aria-hidden="true">
<path class="grid" d="M0 180H620M0 125H620M0 70H620M0 20H620"/>
<path class="path" d="M20 205 C110 195 145 168 220 165 S350 115 410 95 S520 48 600 16"/>
<text id="plane" x="545" y="60">✈</text>
</svg><div class="center" id="flightLabel">الطائرة في وضع الانتظار</div>
</div>
<div class="panel">
<div class="tile"><small>رقم الجولة</small><strong id="round">—</strong></div>
<div class="tile"><small>آخر مضاعف مؤكد</small><strong class="accent" id="multiplier">—</strong></div>
</div>
<div class="alert"><b id="stateTitle">جاهز</b><span id="stateText">افتح اللعبة وفعّل التقاط البيانات من إضافة المتصفح. ستظهر حالة الجولة عند وصول أحداث فعلية.</span></div>
</main>
<footer><span>SKY PREDICT · مراقبة فعلية عند توفر البيانات</span><button class="secondary" id="details">حالة الاتصال</button></footer>
</section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let lastEventAt=0,lastRound='—',isFlying=false,latest=[];
const req=()=>window.postMessage({source:'crash-flight-dashboard',type:'get-events',requestId:String(Date.now())},location.origin);
window.addEventListener('message',e=>{
 if(e.source!==window||e.origin!==location.origin||e.data?.source!=='crash-flight-extension')return;
 if(e.data.type==='unavailable'){$('connection').textContent='الإضافة غير متاحة';return}
 if(e.data.type!=='events'||!Array.isArray(e.data.events))return;
 latest=e.data.events;
 if(latest.length){const newest=latest[latest.length-1];lastEventAt=Number(newest.receivedAt)||0;render(latest)}
});
function render(events){
 const recent=events.slice(-150);
 const start=[...recent].reverse().find(x=>x.target==='OnStart');
 const crash=[...recent].reverse().find(x=>x.target==='OnCrash');
 if(start&&(!crash||start.receivedAt>crash.receivedAt)){
  isFlying=true;$('scene').classList.add('flying');$('dot').classList.add('on');$('connection').textContent='بيانات حية';$('stateTitle').textContent='الجولة جارية';$('stateText').textContent='تم رصد بداية الجولة من اتصال اللعبة.';$('flightLabel').textContent='الطائرة في الجو';$('round').textContent=start.roundId||start.l||'جارية';return;
 }
 if(crash){
  isFlying=false;$('scene').classList.remove('flying');$('dot').classList.add('on');$('connection').textContent='تم استقبال النتيجة';$('stateTitle').textContent='انتهت الجولة';$('stateText').textContent='تم التقاط رسالة نهاية الجولة من اللعبة.';$('flightLabel').textContent='انتهت الرحلة';
  $('round').textContent=crash.roundId||crash.l||'—';$('multiplier').textContent=typeof crash.f==='number'?((crash.f>100?crash.f/100:crash.f).toFixed(2)+'x'):'وصلت النتيجة';return;
 }
 $('connection').textContent='متصل · بانتظار الجولة';$('dot').classList.add('on');
}
$('details').onclick=()=>{$('stateTitle').textContent='تشخيص الاتصال';$('stateText').textContent=latest.length?'عدد الرسائل المحفوظة: '+latest.length+' · آخر رسالة: '+new Date(lastEventAt).toLocaleTimeString():'لم تصل رسائل بعد. تأكد من تثبيت الإضافة وتفعيلها على صفحة اللعبة ثم أعد تحميل صفحة اللعبة.'};
req();setInterval(req,1500);
setInterval(()=>{if(lastEventAt&&Date.now()-lastEventAt>20000){$('dot').classList.remove('on');$('connection').textContent='لا توجد بيانات حديثة'}},3000);
})();
</script></body></html>
