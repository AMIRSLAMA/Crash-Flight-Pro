<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d16"><title>Crash Flight</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,"Segoe UI",sans-serif;background:#080d16;color:#f4f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 0,#1b3048,#080d16 68%)}
.card{width:min(370px,100%);aspect-ratio:1/1;border:1px solid #35465d;border-radius:24px;background:linear-gradient(155deg,#14243a,#0b1321 65%);box-shadow:0 24px 70px #0009;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.brand{font-size:15px;letter-spacing:2px;color:#9eb1c9;font-weight:700}.brand b{color:#f6bd4d}
.label{font-size:14px;color:#aebbd0;margin-top:8px}.round{font-size:clamp(27px,8vw,38px);font-weight:900;direction:ltr;color:#fff;font-variant-numeric:tabular-nums}
.divider{width:100%;height:1px;background:#2a3a50;margin:2px 0}
.forecast{font-size:clamp(42px,11vw,56px);font-weight:900;color:#f6c45b;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 4px 18px #0008}
.meta{font-size:11px;color:#9eafc4;line-height:1.6;min-height:34px}
button{width:100%;border:0;border-radius:14px;padding:16px 12px;font-size:16px;font-weight:900;color:#08120d;background:linear-gradient(#ffd16c,#e8a72d);cursor:pointer;box-shadow:0 8px 22px #e9a72d33}
button:disabled{opacity:.55;cursor:wait}
.status{font-size:11px;color:#94a7bf;min-height:16px}
.note{font-size:10px;color:#788ba4;line-height:1.5}
</style></head>
<body>
<main class="card">
 <div class="brand">✈ CRASH <b>FLIGHT</b></div>
 <section style="width:100%">
  <div class="label">رقم الجولة القادمة</div>
  <div class="round" id="nextRound">—</div>
  <div class="label" style="font-size:11px">رقم حسابك</div>
  <div style="display:flex;gap:6px;width:100%;margin-top:6px">
   <input id="accountIdInput" type="text" inputmode="numeric" autocomplete="off" placeholder="اكتب رقم حسابك" aria-label="رقم حسابك" style="min-width:0;flex:1;border:1px solid #40536d;border-radius:9px;background:#091321;color:#fff;padding:9px;text-align:center;font-size:14px;direction:ltr">
   <button id="saveAccount" type="button" style="width:auto;padding:9px 12px;border-radius:9px;font-size:12px">حفظ</button>
  </div>
  <div id="accountStatus" style="font-size:10px;color:#9eafc4;margin-top:4px;min-height:13px">يُحفظ محليًا في هذا المتصفح فقط</div>
 </section>
 <div class="divider"></div>
 <section style="width:100%">
  <div class="label">التوقع الواحد للجولة القادمة</div>
  <div class="forecast" id="forecast">—</div>
  <div class="meta" id="meta">اضغط الزر بنفسك قبل بداية الجولة لحساب تقدير جديد.</div>
 </section>
 <button id="predict">احسب توقع الجولة القادمة</button>
 <div class="status" id="status">في انتظار طلبك</div>
 <div class="note">تقدير إحصائي من النتائج المسجلة، وليس معرفة مسبقة أو ضمانًا للنتيجة.</div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
let crashes=[], nextRound=null, requestPending=false, requestTimer=null, roundFinished=false, activeRequestId=null, lastCrashAt=null, crashEventCount=0;
function askForEvents(){activeRequestId=String(Date.now())+"-"+Math.random().toString(36).slice(2);window.postMessage({source:"crash-flight-dashboard",type:"get-events",requestId:activeRequestId},"*");}
const accountInput=$("accountIdInput"), accountStatus=$("accountStatus");
try{accountInput.value=localStorage.getItem("crashFlightAccountId")||"";}catch(_){}
$("saveAccount").addEventListener("click",()=>{
 const value=accountInput.value.trim();
 if(value&&!/^\\d{4,20}$/.test(value)){accountStatus.textContent="اكتب رقم الحساب بالأرقام فقط.";return;}
 try{
  if(value)localStorage.setItem("crashFlightAccountId",value);
  else localStorage.removeItem("crashFlightAccountId");
  accountStatus.textContent=value?"تم حفظ رقم حسابك محليًا على هذا المتصفح.":"تم مسح رقم الحساب المحفوظ.";
 }catch(_){accountStatus.textContent="تعذر الحفظ المحلي؛ تحقق من إعدادات المتصفح.";}
});
function readEvents(events){
 if(!Array.isArray(events))return;
 const crashEvents=events.filter(e=>e&&e.target==="OnCrash");
 crashEventCount=crashEvents.length;
 const validCrashes=crashEvents.filter(e=>Number.isFinite(Number(e.f))&&Number(e.f)>=1&&Number(e.f)<=100000);
 crashes=validCrashes.map(e=>Number(e.f)).slice(-200);
 lastCrashAt=validCrashes.length?validCrashes[validCrashes.length-1].receivedAt:null;
 const betting=[...events].reverse().find(e=>e&&e.target==="OnBetting"&&e.roundId!==undefined&&e.roundId!==null);
 const stage=[...events].reverse().find(e=>e&&e.target==="OnStage"&&e.roundId!==undefined&&e.roundId!==null);
 nextRound=betting?.roundId??stage?.roundId??null;
 if(nextRound!==null)$("nextRound").textContent="#"+nextRound;
}function calculate(){
 if(nextRound===null){$("forecast").textContent="—";$("meta").textContent="لم يصل رقم الجولة من الإضافة بعد. افتح اللعبة ثم حاول مرة أخرى.";return false;}
 if(crashes.length<8){$("forecast").textContent="—";$("meta").textContent="نحتاج 8 نتائج مسجلة على الأقل لتجربة المعادلة الجديدة؛ المتاح "+crashes.length+".";return false;}
 // Experimental formula: recency-weighted geometric center, robust median anchor,
 // and a small damped log-trend adjustment. This is a test heuristic, not a prediction of RNG.
 const sample=crashes.slice(-30).filter(v=>Number.isFinite(v)&&v>=1);
 const recent=sample.slice(-12);
 const logs=recent.map(v=>Math.log(v));
 let weightedLog=0,totalWeight=0;
 logs.forEach((value,i)=>{const weight=Math.pow(1.18,i);weightedLog+=value*weight;totalWeight+=weight;});
 const weightedGeo=Math.exp(weightedLog/totalWeight);
 const sorted=recent.slice().sort((a,b)=>a-b);
 const mid=Math.floor(sorted.length/2);
 const robustMedian=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
 const half=Math.floor(recent.length/2);
 const older=recent.slice(0,half),newer=recent.slice(half);
 const meanLog=a=>a.reduce((sum,v)=>sum+Math.log(v),0)/a.length;
 const trend=older.length&&newer.length?meanLog(newer)-meanLog(older):0;
 const dampedTrend=Math.max(-0.12,Math.min(0.12,trend*0.18));
 const estimate=Math.max(1.01,Math.min(100,Math.exp(Math.log(weightedGeo)*0.65+Math.log(robustMedian)*0.35+dampedTrend)));
 $("forecast").textContent=estimate.toFixed(2)+"x";
 $("meta").textContent="المعادلة التجريبية الجديدة: مركز هندسي مرجّح لآخر 12 نتيجة + وسيط مقاوم للقيم الشاذة + تعديل اتجاه محدود. استخدمت "+recent.length+" نتيجة من آخر "+sample.length+" نتيجة. هذه تجربة حسابية وليست كشفًا مسبقًا أو ضمانًا.";
 return true;
}
window.addEventListener("message",e=>{
 if(e.source!==window||e.data?.source!=="crash-flight-extension")return;
 if(e.data.type==="events"&&(!activeRequestId||e.data.requestId===activeRequestId)){
  readEvents(e.data.events||[]);
  const allEvents=e.data.events||[];
  const lastCrash=[...allEvents].reverse().find(ev=>ev&&ev.target==="OnCrash");
  const lastRoundStart=[...allEvents].reverse().find(ev=>ev&&(["OnStage","OnBetting","OnStart"].indexOf(ev.target)>=0));
  roundFinished=!!lastCrash&&(!lastRoundStart||Number(lastCrash.receivedAt)>Number(lastRoundStart.receivedAt));
  $("predict").hidden=false;
  if(requestPending){
   requestPending=false;clearTimeout(requestTimer);
   $("predict").disabled=false;
   try{
    const ok=calculate();
    const stamp=lastCrashAt?new Date(lastCrashAt).toLocaleTimeString("ar-EG"):"لا توجد نتيجة انفجار صالحة";
    $("status").textContent=ok?"تم تحديث السجل: "+crashes.length+" نتيجة صالحة من "+crashEventCount+" رسالة انفجار. آخر نتيجة: "+stamp:"السجل: "+crashes.length+" نتيجة صالحة من "+crashEventCount+" رسالة انفجار؛ "+(lastCrashAt?"آخر نتيجة "+stamp:"لم تُلتقط قيمة انفجار صالحة")+". راجع اتصال الإضافة.";
   }catch(err){
    $("forecast").textContent="تعذر الحساب";
    $("meta").textContent="حدث خطأ أثناء التحليل؛ لم يتم تغيير سجل النتائج.";
    $("status").textContent="حصل خطأ في المعادلة. الزر متاح لإعادة المحاولة.";
    console.error("Crash Flight calculation error:",err);
   }finally{
    $("predict").disabled=false;
   }
  }
 }
 if(e.data.type==="unavailable"&&(!activeRequestId||e.data.requestId===activeRequestId)){
  requestPending=false;clearTimeout(requestTimer);$("predict").disabled=false;
  $("status").textContent="الإضافة غير متصلة؛ افتح اللعبة وفعّل الإضافة.";
 }
});
$("predict").addEventListener("click",()=>{
 if(requestPending)return;
 $("predict").disabled=true;$("status").textContent="جارٍ جلب النتائج بطلبك...";
 requestPending=true;
 try{askForEvents();}catch(err){
  requestPending=false;$("predict").disabled=false;
  $("status").textContent="تعذر الاتصال بالإضافة؛ الزر جاهز لإعادة المحاولة.";
  console.error("Crash Flight extension request error:",err);
  return;
 }
 requestTimer=window.setTimeout(()=>{
  if(requestPending){requestPending=false;activeRequestId=null;$("predict").disabled=false;$("status").textContent="لم يصل رد الإضافة خلال 10 ثوانٍ. أعد تحميل صفحة البرنامج واللعبة، ثم جرّب مرة أخرى.";}
 },10000);
});
</script>
</body></html>
