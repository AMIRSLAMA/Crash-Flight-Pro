name: Capture protocol tests

on:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/messagepack-capture-tests.yml"
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/messagepack-capture-tests.yml"

jobs:
  messagepack-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check extension/messagepack.js
          node --check extension/inject.js
          node --check extension/content.js
          node --check extension/background.js
          node --check extension/popup.js
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
      - name: Run MessagePack protocol tests
        run: node extension/test-messagepack.js
