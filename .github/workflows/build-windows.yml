name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name CrashFlightPro --collect-all PySide6 --collect-all PySide6_Addons main.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/CrashFlightPro/* -DestinationPath CrashFlightPro-Windows.zip
      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CrashFlightPro-Windows
          path: CrashFlightPro-Windows.zip
          if-no-files-found: error
          retention-days: 14
