name: Build and publish Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name CrashFlightPro --collect-all PySide6 main.py
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/CrashFlightPro/* -DestinationPath CrashFlightPro-Windows.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrashFlightPro-Windows
          path: CrashFlightPro-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish to stable release link
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view desktop-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest --title "Crash Flight Pro for Windows" --notes "Windows desktop build. Download ZIP, extract it, and run CrashFlightPro.exe. Experimental event capture; no guaranteed future crash prediction." --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload desktop-latest CrashFlightPro-Windows.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
